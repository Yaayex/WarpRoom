<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarpRoom | Ephemeral Share</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Экран входа -->
    <div id="auth-screen" class="screen active">
        <div class="glass-card">
            <div class="logo">Warp<span>Room</span></div>
            <p class="subtitle">Эфемерное пространство. Никаких логов.</p>
            
            <button id="create-btn" class="primary-btn">Создать комнату</button>
            
            <div class="divider"><span>или</span></div>
            
            <div class="join-group">
                <input type="text" id="room-code-input" placeholder="Код комнаты (5 букв)" maxlength="5">
                <button id="join-btn" class="secondary-btn">Войти</button>
            </div>
        </div>
    </div>

    <!-- Комната -->
    <div id="room-screen" class="screen">
        <header class="glass-header">
            <div class="header-info">
                <span class="room-label">Код доступа:</span>
                <span id="display-room-code" class="code-badge">ХХХХХ</span>
            </div>
            <button id="leave-btn" class="danger-btn">Покинуть и уничтожить</button>
        </header>

        <main id="chat-area">
            <div class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5; margin-bottom: 16px;"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                <p>Перетащите файлы сюда или отправьте текст.</p>
                <p class="sub-text">Все данные исчезнут, как только последний человек закроет вкладку.</p>
            </div>
            <div id="messages"></div>
        </main>

        <div class="input-area glass-footer">
            <input type="text" id="message-input" placeholder="Напишите сообщение или вставьте ссылку..." autocomplete="off">
            <button id="file-btn" title="Прикрепить файл">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input type="file" id="file-input" style="display: none;">
            <button id="send-btn" class="primary-btn icon-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        
        <!-- Оверлей для Drag&Drop -->
        <div id="drop-overlay">
            <div class="drop-content">
                <p>Бросайте файлы сюда</p>
            </div>
        </div>
    </div>

    <!-- Экран уничтожения -->
    <div id="destroyed-screen" class="screen">
        <div class="glass-card destroyed-card">
            <h2>Пространство растворилось</h2>
            <p>Данные были навсегда удалены из оперативной памяти.</p>
            <button onclick="location.reload()" class="primary-btn">Вернуться на главную</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
